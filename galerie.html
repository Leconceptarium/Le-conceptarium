
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie – Le Conceptarium</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1em;
      margin-top: 2em;
    }
    .gallery img {
      width: 100%;
      border-radius: 8px;
      transition: transform 0.3s ease;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">Le Conceptarium</div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="projets.html">Projets</a>
      <a href="galerie.html" class="active">Galerie</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Galerie immersive</h1>
    <p style="text-align:center;">Aperçus visuels, objets narratifs et éléments de scénographie</p>
    <div class="gallery">
      <img src="https://via.placeholder.com/400x250/5b2c84/ffffff?text=Projet+1" alt="Projet 1" />
      <img src="https://via.placeholder.com/400x250/6a1b9a/ffffff?text=Destiny+Box" alt="Projet 2" />
      <img src="https://via.placeholder.com/400x250/512da8/ffffff?text=Brisebard" alt="Projet 3" />
    </div>
  </main>

  <footer>
    <p>© 2025 Le Conceptarium – Tous droits réservés</p>
  </footer>
</body>
</html>
