
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galerie – Le Conceptarium</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1em;
      margin-top: 2em;
    }
    .gallery img {
      width: 100%;
      border-radius: 8px;
      transition: transform 0.3s ease;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  
  <header class="navbar">
    <div class="logo">Le Conceptarium</div>
    <div class="burger">
      <div></div><div></div><div></div>
    </div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="projets.html">Projets</a>
      <a href="prestations.html">Prestations</a>
      <a href="galerie.html">Galerie</a>
      <a href="a-propos.html">À propos</a>
      <a href="contact.html">Contact</a>
      <a href="blog.html">Blog</a>
    </nav>
  </header>


  <main>
    <h1>Galerie immersive</h1>
    <p style="text-align:center;">Aperçus visuels, objets narratifs et éléments de scénographie</p>
    <div class="gallery">
      <img src="IMG_1660.png" alt=" " />
      <img src="IMG_2358.png" alt=" " />
      <img src="IMG_1718.gif" alt=" " />
      <img src="2091D76A-EC3C-4096-9E2A-14B51E30514D.jpg" alt=" " />
      <img src="67EF1AEE-7C96-467E-90D6-3C76F4B69A85.jpg" alt=" " />
    <img src="IMG_6604.JPG" alt=" " />
    </div>
  </main>

  <footer>
    <p>© 2025 Le Conceptarium – Tous droits réservés</p>
  </footer>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const burger = document.querySelector(".burger");
    const nav = document.querySelector(".navbar nav");
    burger.addEventListener("click", () => {
      nav.classList.toggle("active");
    });
  });
</script>

</body>
</html>
