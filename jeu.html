<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>L’Ombre du Rêveur – Fragments Piégés</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0d0b1f;
      overflow: hidden;
      font-family: 'EB Garamond', serif;
      color: white;
    }
    canvas {
      display: block;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.4);
      padding: 0.5em 1em;
      border-radius: 10px;
      font-size: 1em;
      z-index: 10;
    }
    #transition {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(13,11,31,0.8) 100%);
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      font-size: 2em;
    }
  </style>
</head>
<body>
  <div id="ui">Fragments : 0 | Bots : 0</div>
  <div id="transition">Une nouvelle vague approche…</div>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    let level = 1;
    let nextWaveTriggered = false;

    const botNames = ["Nyx", "Umbra", "Vesper", "Echo", "Noctis", "Zar", "Lira", "Seth"];
    const botColors = ["#7754cc", "#ff6699", "#66ccff", "#ffaa00", "#99ff66", "#cc66ff", "#33ffaa", "#ff3333"];

    class Entity {
      constructor(x, y, radius, color, isBot = false, name = "") {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;
        this.score = 0;
        this.isBot = isBot;
        this.name = name;
        this.target = null;
        this.alive = true;
        this.speed = isBot ? (level === 1 ? 1.8 : 2.6) : 0;
      }

      update() {
        if (!this.alive) return;
        if (!this.isBot) {
          this.x += (mouse.x - this.x) * 0.07;
          this.y += (mouse.y - this.y) * 0.07;
        } else {
          if (!this.target || this.target.collected) {
            this.target = fragments[Math.floor(Math.random() * fragments.length)];
          }
          if (this.target) {
            let dx = this.target.x - this.x;
            let dy = this.target.y - this.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 1) {
              this.x += (dx / dist) * this.speed;
              this.y += (dy / dist) * this.speed;
            }
          }
        }
      }

      draw() {
        if (!this.alive) return;
        ctx.beginPath();
        let gradient = ctx.createRadialGradient(this.x, this.y, 5, this.x, this.y, this.radius);
        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(1, this.color);
        ctx.fillStyle = gradient;
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        if (this.isBot) {
          ctx.fillStyle = "white";
          ctx.font = "14px EB Garamond";
          ctx.textAlign = "center";
          ctx.fillText(this.name, this.x, this.y - this.radius - 10);
        }
      }
    }

    class Fragment {
      constructor(isTrap = false) {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = 8 + Math.random() * 3;
        this.collected = false;
        this.isTrap = isTrap;
      }

      draw() {
        if (!this.collected) {
          ctx.beginPath();
          ctx.fillStyle = this.isTrap ? "#ff3333" : "#d9b3ff";
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    const player = new Entity(canvas.width / 2, canvas.height / 2, 10, "#a366ff", false, "Toi");
    let bots = spawnBots(5);
    let fragments = spawnInitialFragments(15);

    function spawnInitialFragments(n) {
      return Array.from({ length: n }, () => new Fragment(Math.random() < 0.2));
    }

    function spawnFragment() {
      fragments.push(new Fragment(Math.random() < 0.2));
    }

    function updateUI() {
      document.getElementById("ui").innerText =
        "Fragments : " + player.score + " | Bots : " + bots.filter(b => b.alive).length;
    }

    function spawnBots(n) {
      const arr = [];
      for (let i = 0; i < n; i++) {
        arr.push(new Entity(
          Math.random() * canvas.width,
          Math.random() * canvas.height,
          15,
          botColors[i % botColors.length],
          true,
          botNames[i % botNames.length]
        ));
      }
      return arr;
    }

    function triggerNextWave() {
      const t = document.getElementById("transition");
      t.style.display = "flex";
      setTimeout(() => {
        t.style.display = "none";
        level = 2;
        player.radius = 10;
        bots = spawnBots(8);
      }, 3000);
    }

    function gameLoop() {
      ctx.fillStyle = "rgba(13,11,31,0.25)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      [...bots, player].forEach(e => {
        e.update();
        e.draw();

        fragments.forEach(f => {
          if (!f.collected && e.alive) {
            const dx = e.x - f.x;
            const dy = e.y - f.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < e.radius + f.radius) {
              f.collected = true;
              if (f.isTrap) {
                e.radius = Math.max(5, e.radius / 2);
              } else {
                e.score++;
                e.radius += 0.6;
              }
              spawnFragment();
            }
          }
        });

        if (!e.isBot || !e.alive) return;
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < player.radius && player.radius > e.radius + 5 && e.alive) {
          e.alive = false;
          player.score += e.score;
          player.radius += e.radius / 2;
        }

        if (dist < e.radius && e.radius > player.radius + 5 && player.alive) {
          alert("Tu as été absorbé… Recommençons !");
          location.reload();
        }
      });

      if (!nextWaveTriggered && bots.every(b => !b.alive)) {
        nextWaveTriggered = true;
        triggerNextWave();
      }

      fragments.forEach(f => f.draw());
      updateUI();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();

    canvas.addEventListener("mousemove", e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    canvas.addEventListener("touchmove", e => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    }, { passive: false });

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
