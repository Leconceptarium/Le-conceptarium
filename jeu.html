<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Le Sanctuaire du Rêveur</title>
  <style>
    body, html {
      margin: 0;
      overflow: hidden;
      background: #0d0b1f;
      font-family: 'EB Garamond', serif;
    }
    #intro {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 2em;
      border-radius: 10px;
      color: white;
      text-align: center;
      z-index: 10;
    }
    canvas { display: block; }
    button {
      margin-top: 1em;
      padding: 0.5em 1.2em;
      background: #a366ff;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <div id="intro">
    <p>Vous êtes dans le sanctuaire du Rêveur...<br>Trouvez les 3 fragments d’éveil.</p>
    <button onclick="startGame()">Commencer</button>
  </div>
  <canvas id="c"></canvas>

  <!-- Inclusion des scripts UMD via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>

  <script>
    let camera, scene, renderer, controls;
    let fragments = [];
    let collected = 0;
    const fragmentCount = 3;

    function startGame() {
      document.getElementById("intro").style.display = "none";
      init();
    }

    function init() {
      const canvas = document.getElementById("c");
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d0b1f);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 5, 10);

      renderer = new THREE.WebGLRenderer({ canvas });
      renderer.setSize(window.innerWidth, window.innerHeight);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.maxPolarAngle = Math.PI / 2;
      controls.minDistance = 2;
      controls.maxDistance = 15;

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(50, 50),
        new THREE.MeshStandardMaterial({ color: 0x1a1a2e })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const light = new THREE.PointLight(0xffffff, 1, 100);
      light.position.set(10, 15, 10);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x8888ff, 0.4));

      const fragmentGeo = new THREE.IcosahedronGeometry(0.5, 0);
      const fragmentMat = new THREE.MeshStandardMaterial({ color: 0xcc99ff, emissive: 0x6633aa });

      for (let i = 0; i < fragmentCount; i++) {
        const mesh = new THREE.Mesh(fragmentGeo, fragmentMat);
        mesh.position.set(
          (Math.random() - 0.5) * 30,
          0.5,
          (Math.random() - 0.5) * 30
        );
        scene.add(mesh);
        fragments.push(mesh);
      }

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      fragments.forEach(frag => {
        if (frag.visible) {
          const dist = camera.position.distanceTo(frag.position);
          if (dist < 1.5) {
            frag.visible = false;
            collected++;
            if (collected === fragmentCount) {
              setTimeout(() => {
                alert("Les fragments ont été réunis... Vous êtes éveillé.");
                location.reload();
              }, 500);
            }
          }
        }
      });

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.startGame = startGame;
  </script>
</body>
</html>
