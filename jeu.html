<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L’Ombre du Rêveur – L’Ultime Vague</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0d0b1f;
      overflow: hidden;
      font-family: 'EB Garamond', serif;
      color: white;
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(0,0,0,0.4);
      padding: 0.5em 1em;
      border-radius: 10px;
      font-size: 1em;
      z-index: 10;
    }
    #transition {
      position: absolute;
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.6), rgba(13,11,31,0.8));
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      font-size: 2em;
    }
  </style>
</head>
<body>
  <div id="ui">Fragments : 0 | Bots : 0</div>
  <div id="transition">Une nouvelle vague approche…</div>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
    let wave = 1;
    let veilActive = false;
    let veilTimer = 0;

    const botNames = ["Nyx", "Umbra", "Vesper", "Echo", "Noctis", "Zar", "Lira", "Seth"];
    const botColors = ["#7754cc", "#ff6699", "#66ccff", "#ffaa00", "#99ff66", "#cc66ff", "#33ffaa", "#ff3333"];
        const player = new Entity(canvas.width / 2, canvas.height / 2, 10, "#a366ff", false, "Toi");
    let bots = [];
    let fragments = [];

    function spawnFragments(n, traps = 0.1, power = false) {
      fragments = [];
      for (let i = 0; i < n; i++) {
        let type = Math.random() < traps ? "trap" : "normal";
        fragments.push(new Fragment(type));
      }
      if (power) fragments.push(new Fragment("power"));
    }

    function spawnBots(n) {
      const arr = [];
      for (let i = 0; i < n; i++) {
        arr.push(new Entity(
          Math.random() * canvas.width,
          Math.random() * canvas.height,
          15,
          botColors[i % botColors.length],
          true,
          botNames[i % botNames.length]
        ));
      }
      return arr;
    }

    function triggerNextWave(waveNum) {
      const t = document.getElementById("transition");
      t.style.display = "flex";
      t.innerText = "Vague " + waveNum + " approche...";
      fragments = [];

      setTimeout(() => {
        t.style.display = "none";
        wave = waveNum;
        switch (waveNum) {
          case 2:
            bots = spawnBots(8);
            spawnFragments(20, 0.15);
            break;
          case 3:
            bots = spawnBots(6);
            bots.push(new Entity(Math.random()*canvas.width, Math.random()*canvas.height, 20, "#ffffff", true, "Le Veilleur", true));
            spawnFragments(20, 0.25);
            break;
          case 4:
            bots = spawnBots(10);
            spawnFragments(22, 0.35, true);
            break;
          case 5:
            bots = spawnBots(12);
            spawnFragments(25, 0.4);
            break;
        }
      }, 3000);
    }
        function updateUI() {
      document.getElementById("ui").innerText =
        "Fragments : " + player.score + " | Bots : " + bots.filter(b => b.alive).length;
    }

    function gameLoop() {
      if (veilActive && --veilTimer <= 0) {
        veilActive = false;
        player.radius /= 1.5;
      }

      ctx.fillStyle = "rgba(13,11,31,0.25)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      [...bots, player].forEach(e => {
        e.update();
        e.draw();

        fragments.forEach(f => {
          if (!f.collected && e.alive) {
            const dx = e.x - f.x;
            const dy = e.y - f.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < e.radius + f.radius) {
              f.collected = true;
              if (f.type === "trap") {
                e.radius = Math.max(5, e.radius / 2);
              } else if (f.type === "power" && e === player) {
                veilActive = true;
                veilTimer = 180;
                player.radius *= 1.5;
              } else {
                e.score++;
                e.radius += 0.6;
              }
              fragments.push(new Fragment(Math.random() < 0.25 ? "trap" : "normal"));
            }
          }
        });

        if (!e.isBot || !e.alive) return;
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < player.radius && player.radius > e.radius + 5 && e.alive) {
          e.alive = false;
          player.score += e.score;
          player.radius += e.radius / 2;
        }

        if (dist < e.radius && e.radius > player.radius + 5 && player.alive) {
          alert("Tu as été absorbé… Recommençons !");
          location.reload();
        }
      });

      if (bots.every(b => !b.alive)) {
        if (wave < 5) triggerNextWave(wave + 1);
        else {
          alert("Tu as survécu à toutes les vagues. Le rêve t'accepte.");
          location.reload();
        }
      }

      fragments.forEach(f => f.draw());
      updateUI();
      requestAnimationFrame(gameLoop);
    }
        bots = spawnBots(5);
    spawnFragments(15, 0.05); // Niveau 1 : très peu de pièges
    gameLoop();

    // Souris desktop
    canvas.addEventListener("mousemove", e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    // Doigt mobile
    canvas.addEventListener("touchmove", e => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    }, { passive: false });

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
