<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Le Sanctuaire du Rêveur</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'EB Garamond', serif;
      background: #0d0b1f;
    }
    canvas { display: block; }
    #intro {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      padding: 1em 2em;
      color: white;
      border-radius: 10px;
      text-align: center;
      z-index: 10;
    }
    #joystick {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      touch-action: none;
      z-index: 10;
    }
    #stick {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      position: absolute;
      top: 30px;
      left: 30px;
    }
  </style>
</head>
<body>
  <div id="intro">
    *Vous êtes dans le sanctuaire du Rêveur...<br>Trouvez les 3 fragments d’éveil.*<br><br>
    <button onclick="startGame()">Commencer</button>
  </div>
  <div id="joystick"><div id="stick"></div></div>
  <canvas id="gameCanvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    let scene, camera, renderer, player, light;
    let fragments = [], collected = 0;
    let moveX = 0, moveZ = 0;

    const canvas = document.getElementById("gameCanvas");
    const intro = document.getElementById("intro");

    function startGame() {
      intro.style.display = "none";
      init();
      animate();
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const playerGeo = new THREE.SphereGeometry(0.6, 16, 16);
      const playerMat = new THREE.MeshStandardMaterial({ color: 0x8844ff, emissive: 0x331155 });
      player = new THREE.Mesh(playerGeo, playerMat);
      player.position.y = 0.5;
      scene.add(player);

      const floorGeo = new THREE.PlaneGeometry(40, 40, 10, 10);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x1f102f, emissive: 0x110022 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      light = new THREE.PointLight(0xff00ff, 2, 30);
      light.position.set(0, 5, 5);
      scene.add(light);

      camera.position.set(0, 6, 6);
      camera.lookAt(player.position);

      for (let i = 0; i < 3; i++) {
        const frag = new THREE.Mesh(
          new THREE.SphereGeometry(0.4, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0xffaaff, emissive: 0xaa22aa })
        );
        frag.position.set((Math.random() - 0.5) * 30, 0.5, (Math.random() - 0.5) * 30);
        fragments.push(frag);
        scene.add(frag);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      light.position.x = Math.sin(Date.now() * 0.001) * 8;
      light.position.z = Math.cos(Date.now() * 0.001) * 8;

      const nextX = player.position.x + moveX * 0.1;
      const nextZ = player.position.z + moveZ * 0.1;

      if (Math.abs(nextX) < 18) player.position.x = nextX;
      if (Math.abs(nextZ) < 18) player.position.z = nextZ;

      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 6;
      camera.lookAt(player.position);

      fragments.forEach(f => {
        if (f.visible && player.position.distanceTo(f.position) < 1) {
          f.visible = false;
          collected++;
          if (collected === 3) showEnd();
        }
      });

      renderer.render(scene, camera);
    }

    function showEnd() {
      const msg = document.createElement("div");
      msg.innerHTML = "<h1 style='color:white;text-align:center;'>Vous avez rassemblé les fragments...<br>Le Sanctuaire s’ouvre à vous.</h1>";
      msg.style.position = "absolute";
      msg.style.top = "50%";
      msg.style.left = "50%";
      msg.style.transform = "translate(-50%, -50%) scale(1)";
      msg.style.background = "rgba(0,0,0,0.7)";
      msg.style.padding = "2em";
      msg.style.borderRadius = "12px";
      msg.style.zIndex = "15";
      msg.style.transition = "transform 1s ease";
      document.body.appendChild(msg);
    }

    const joystick = document.getElementById("joystick");
    const stick = document.getElementById("stick");
    let dragging = false;

    joystick.addEventListener("touchstart", e => { dragging = true; });
    joystick.addEventListener("touchmove", e => {
      if (!dragging) return;
      const touch = e.touches[0];
      const rect = joystick.getBoundingClientRect();
      const dx = touch.clientX - rect.left - 50;
      const dy = touch.clientY - rect.top - 50;
      stick.style.left = `${dx + 30}px`;
      stick.style.top = `${dy + 30}px`;
      moveX = dx / 50;
      moveZ = dy / 50;
    });
    joystick.addEventListener("touchend", () => {
      dragging = false;
      moveX = 0;
      moveZ = 0;
      stick.style.left = "30px";
      stick.style.top = "30px";
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
