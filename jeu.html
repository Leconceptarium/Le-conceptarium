<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sanctuaire Mystique</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap');
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #15002b 0%, #000010 100%);
      font-family: 'Unbounded', sans-serif;
    }
    canvas {
      display: block;
    }
    h1 {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 28px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 10px #ff00cc;
    }
    #restartBtn {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 30px;
      font-size: 20px;
      background: #ff00cc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 0 20px #ff00cc;
    }
    #restartBtn:hover {
      background: #e000b5;
    }
  </style>
</head>
<body>
  <h1>Le Sanctuaire du Rêveur</h1>
  <button id="restartBtn">Réveiller à nouveau</button>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const restartBtn = document.getElementById('restartBtn');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 15,
      color: '#ffffff',
      speed: 3.5
    };

    let fragments = [];
    let bots = [];
    let frame = 0;
    let gameRunning = true;

    function spawnFragments() {
      for (let i = 0; i < 25; i++) {
        const isTrap = Math.random() < 0.1;
        fragments.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: 6,
          color: isTrap ? '#00ffff' : '#ff0055',
          trap: isTrap
        });
      }
    }

    function spawnBot() {
      bots.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: 25 + Math.random() * 10,
        color: '#9933ff',
        speed: 0.8 + Math.random() * 0.6
      });
    }

    function drawCircle(entity) {
      ctx.beginPath();
      ctx.arc(entity.x, entity.y, entity.radius, 0, Math.PI * 2);
      ctx.fillStyle = entity.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = entity.color;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function moveToward(entity, target, speed) {
      let dx = target.x - entity.x;
      let dy = target.y - entity.y;
      let dist = Math.hypot(dx, dy);
      if (dist > 0) {
        entity.x += (dx / dist) * speed;
        entity.y += (dy / dist) * speed;
      }
    }

    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fragments.forEach(drawCircle);
      bots.forEach(drawCircle);
      drawCircle(player);
    }

    function updateGame() {
      if (!gameRunning) return;

      moveToward(player, mouse, player.speed);
      bots.forEach(bot => moveToward(bot, player, bot.speed));

      fragments = fragments.filter(f => {
        if (distance(f, player) < player.radius + f.radius) {
          if (f.trap) {
            player.radius = Math.max(10, player.radius / 2);
          } else {
            player.radius += 1;
          }
          return false;
        }
        return true;
      });

      for (let bot of bots) {
        fragments = fragments.filter(f => {
          if (distance(f, bot) < bot.radius + f.radius) {
            bot.radius += 0.5;
            return false;
          }
          return true;
        });
      }

      for (let bot of bots) {
        if (distance(player, bot) < player.radius + bot.radius) {
          if (player.radius > bot.radius) {
            player.radius += bot.radius / 2;
            bot.radius = 0;
          } else {
            gameOver();
            return;
          }
        }
      }

      drawGame();
      frame++;
      if (frame % 500 === 0) {
        spawnFragments();
        spawnBot();
      }

      requestAnimationFrame(updateGame);
    }

    function gameOver() {
      gameRunning = false;
      restartBtn.style.display = 'block';
    }

    function resetGame() {
      player.radius = 15;
      fragments = [];
      bots = [];
      frame = 0;
      gameRunning = true;
      restartBtn.style.display = 'none';
      spawnFragments();
      for (let i = 0; i < 3; i++) spawnBot();
      updateGame();
    }

    restartBtn.addEventListener('click', resetGame);

    let mouse = { x: player.x, y: player.y };
    canvas.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    canvas.addEventListener('touchmove', e => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    }, { passive: false });

    resetGame();
  </script>
</body>
</html>
