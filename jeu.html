<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Le Sanctuaire du Rêveur</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background-color: #0d0b1f; touch-action: none; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      color: white;
      font-family: 'EB Garamond', serif;
      font-size: 1.2em;
      border-radius: 10px;
      z-index: 10;
      max-width: 90%;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="ui">*Vous êtes dans le sanctuaire du Rêveur... Trouvez les 3 fragments d’éveil.*</div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r146/three.min.js"></script>
  <script>
    let scene = new THREE.Scene();
    let camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    let renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.fog = new THREE.Fog(0x0d0b1f, 10, 50);
    const ui = document.getElementById("ui");

    // Lumières
    scene.add(new THREE.AmbientLight(0xd9b3ff, 1.2));
    const pointLight = new THREE.PointLight(0xff66cc, 1, 100);
    pointLight.position.set(10, 15, 10);
    scene.add(pointLight);

    // Sol voxel
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x282043 });
    for (let x = -6; x <= 6; x++) {
      for (let z = -6; z <= 6; z++) {
        const cube = new THREE.Mesh(boxGeo, groundMat);
        cube.position.set(x, -1, z);
        scene.add(cube);
      }
    }

    // Fragments mystiques
    const fragmentMat = new THREE.MeshStandardMaterial({ color: 0xffccff, emissive: 0xaa66ff, emissiveIntensity: 1 });
    const fragments = [];
    const fragmentPositions = [
      [3, 0, -2],
      [-4, 0, 1],
      [0, 0, 4]
    ];

    fragmentPositions.forEach(pos => {
      const frag = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), fragmentMat.clone());
      frag.position.set(...pos);
      frag.userData.collected = false;
      scene.add(frag);
      fragments.push(frag);
    });

    // Caméra
    camera.position.set(0, 1.2, 5);
    let yaw = 0, pitch = 0;
    let touchStartX = 0, touchStartY = 0;
    let collected = 0;

    function animate() {
      requestAnimationFrame(animate);
      fragments.forEach(frag => {
        if (!frag.userData.collected) frag.rotation.y += 0.01;
        const dx = camera.position.x - frag.position.x;
        const dz = camera.position.z - frag.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < 1.2 && !frag.userData.collected) {
          frag.userData.collected = true;
          frag.visible = false;
          collected++;
          if (collected < 3) {
            ui.innerText = `Fragment ${collected} récupéré...`;
          } else {
            ui.innerText = "Les fragments sont réunis. Le Rêveur s’éveille...";
            const light = new THREE.PointLight(0xffffff, 2, 50);
            light.position.set(0, 3, 0);
            scene.add(light);
          }
        }
      });
      renderer.render(scene, camera);
    }

    animate();

    // Touches tactiles pour vue immersive + déplacement
    document.addEventListener("touchstart", e => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    });

    document.addEventListener("touchmove", e => {
      if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;

        yaw -= dx * 0.005;
        pitch -= dy * 0.005;
        pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
        camera.rotation.order = "YXZ";
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        camera.translateZ(-0.1);
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
