<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini-Jeu .io Mystique</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #0a0a0a 0%, #000000 100%);
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 20,
      color: 'white',
      speed: 3
    };

    let fragments = [];
    let bots = [];
    let wave = 1;
    let frame = 0;

    function spawnFragments() {
      for (let i = 0; i < 10; i++) {
        fragments.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: 5,
          color: Math.random() > 0.2 ? 'red' : 'purple',
          trap: Math.random() < 0.2
        });
      }
    }

    function spawnBot() {
      bots.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: 15,
        color: 'blue',
        speed: 1.5
      });
    }

    function drawPlayer() {
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = player.color;
      ctx.fill();
    }

    function drawFragments() {
      for (let f of fragments) {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        ctx.fillStyle = f.color;
        ctx.fill();
      }
    }

    function drawBots() {
      for (let b of bots) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
      }
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function moveBots() {
      for (let b of bots) {
        let dx = player.x - b.x;
        let dy = player.y - b.y;
        let dist = Math.hypot(dx, dy);
        b.x += (dx / dist) * b.speed;
        b.y += (dy / dist) * b.speed;
      }
    }

    function collectFragments() {
      fragments = fragments.filter(f => {
        if (distance(f, player) < player.radius + f.radius) {
          if (f.trap) {
            player.radius = Math.max(10, player.radius / 2);
          } else {
            player.radius += 1;
          }
          return false;
        }
        return true;
      });
    }

    function botCollectsFragments() {
      for (let b of bots) {
        fragments = fragments.filter(f => {
          if (distance(f, b) < b.radius + f.radius) {
            b.radius += 1;
            return false;
          }
          return true;
        });
      }
    }

    function checkCollisions() {
      bots = bots.filter(b => {
        if (distance(player, b) < player.radius + b.radius) {
          if (player.radius > b.radius) {
            player.radius += b.radius / 2;
            return false;
          } else {
            alert("Tu as été absorbé !");
            player.radius = 20;
            bots = [];
            fragments = [];
            wave = 1;
            spawnFragments();
            return false;
          }
        }
        return true;
      });
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawFragments();
      drawBots();
      drawPlayer();
      moveBots();
      collectFragments();
      botCollectsFragments();
      checkCollisions();

      frame++;
      if (frame % 300 === 0) {
        wave++;
        for (let i = 0; i < wave; i++) spawnBot();
        spawnFragments();
      }

      requestAnimationFrame(gameLoop);
    }

    let mouse = { x: player.x, y: player.y };
    canvas.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    canvas.addEventListener('touchmove', e => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    }, { passive: false });

    function updatePlayer() {
      let dx = mouse.x - player.x;
      let dy = mouse.y - player.y;
      let dist = Math.hypot(dx, dy);
      if (dist > 1) {
        player.x += (dx / dist) * player.speed;
        player.y += (dy / dist) * player.speed;
      }
      requestAnimationFrame(updatePlayer);
    }

    spawnFragments();
    spawnBot();
    gameLoop();
    updatePlayer();
  </script>
</body>
</html>
