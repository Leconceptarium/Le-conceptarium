<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sanctuaire Mystique</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap');
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #15002b 0%, #000010 100%);
      font-family: 'Unbounded', sans-serif;
    }
    canvas {
      display: block;
    }
    h1 {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 28px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 10px #ff00cc;
    }
  </style>
</head>
<body>
  <h1>Le Sanctuaire du Rêveur</h1>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 15,
      color: '#ffffff',
      speed: 3.2
    };

    let fragments = [];
    let bots = [];
    let frame = 0;
    let absorbedBots = 0;
    const targetAbsorbed = 10;
    let gameRunning = true;

    function spawnFragments() {
      for (let i = 0; i < 30; i++) {
        const isTrap = Math.random() < 0.1;
        fragments.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: 6,
          color: isTrap ? '#00ffff' : '#ff0055',
          trap: isTrap
        });
      }
    }

    function spawnBot() {
      const isHunter = Math.random() < 0.5;
      bots.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: 20 + Math.random() * 10,
        color: isHunter ? '#9933ff' : '#00ccff',
        speed: isHunter ? 1.4 : 0.6,
        type: isHunter ? 'hunter' : 'wanderer',
        angle: Math.random() * 2 * Math.PI
      });
    }

    function drawCircle(e) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.fillStyle = e.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = e.color;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function moveToward(e, target, speed) {
      const dx = target.x - e.x;
      const dy = target.y - e.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 0) {
        e.x += (dx / dist) * speed;
        e.y += (dy / dist) * speed;
      }
    }

    function moveWanderer(bot) {
      bot.x += Math.cos(bot.angle) * bot.speed;
      bot.y += Math.sin(bot.angle) * bot.speed;
      if (Math.random() < 0.01) bot.angle += (Math.random() - 0.5);
    }

    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fragments.forEach(drawCircle);
      bots.forEach(drawCircle);
      drawCircle(player);
    }

    function updateGame() {
      if (!gameRunning) return;

      moveToward(player, mouse, player.speed);

      bots.forEach(bot => {
        if (bot.type === 'hunter') {
          moveToward(bot, player, bot.speed);
        } else {
          moveWanderer(bot);
        }
      });

      fragments = fragments.filter(f => {
        if (distance(f, player) < player.radius + f.radius) {
          if (f.trap) {
            player.radius = Math.max(10, player.radius / 2);
          } else {
            player.radius += 1;
          }
          return false;
        }
        return true;
      });

      for (let bot of bots) {
        if (bot.type === 'wanderer') {
          fragments = fragments.filter(f => {
            if (distance(f, bot) < bot.radius + f.radius) {
              bot.radius += 0.5;
              return false;
            }
            return true;
          });
        }
      }

      bots = bots.filter(bot => {
        if (distance(player, bot) < player.radius + bot.radius) {
          if (player.radius > bot.radius) {
            player.radius += bot.radius / 2;
            absorbedBots++;
            return false;
          } else {
            alert("Tu as été absorbé...");
            resetGame();
            return false;
          }
        }
        return true;
      });

      drawGame();

      frame++;
      if (frame % 500 === 0) spawnFragments();
      if (frame % 1800 === 0) spawnBot();

      if (absorbedBots >= targetAbsorbed) {
        alert("Tu as triomphé des entités du rêve...");
        resetGame();
        return;
      }

      requestAnimationFrame(updateGame);
    }

    function resetGame() {
      player.radius = 15;
      fragments = [];
      bots = [];
      frame = 0;
      absorbedBots = 0;
      gameRunning = true;
      spawnFragments();
      for (let i = 0; i < 4; i++) spawnBot();
      updateGame();
    }

    let mouse = { x: player.x, y: player.y };
    canvas.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    canvas.addEventListener('touchmove', e => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    }, { passive: false });

    resetGame();
  </script>
</body>
</html>
