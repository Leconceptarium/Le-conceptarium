<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Le Sanctuaire du Rêveur</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap');
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #15002b 0%, #000010 100%);
      font-family: 'Unbounded', sans-serif;
    }
    canvas {
      display: block;
    }
    h1 {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 28px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 10px #ff00cc;
    }
    #progress {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      overflow: hidden;
      z-index: 15;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ff00cc, #00ffff);
      transition: width 0.3s ease;
    }
    #phrase {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 18px;
      text-shadow: 0 0 10px #ff00cc;
      z-index: 15;
      opacity: 0;
      transition: opacity 1s;
    }
  </style>
</head>
<body>
  <h1>Le Sanctuaire du Rêveur</h1>
  <div id="progress"><div id="progress-bar"></div></div>
  <div id="phrase"></div>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const phraseEl = document.getElementById("phrase");
    const progressBar = document.getElementById("progress-bar");

    let player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 15,
      speed: 2.2,
      color: "#ffffff"
    };

    let mouse = { x: player.x, y: player.y };
    let fragments = [];
    let bots = [];
    let frame = 0;
    let powerActive = false;
    let powerTimer = 0;
    let absorbedBots = 0;
    const targetAbsorbed = 10;

    const phrases = [
      "Un souvenir oublié...",
      "Une étincelle s’éveille...",
      "L’un des leurs a chuté...",
      "Le rêve devient lucide...",
      "Tu grandis dans l’ombre..."
    ];

    function showPhrase(text) {
      phraseEl.textContent = text;
      phraseEl.style.opacity = 1;
      setTimeout(() => {
        phraseEl.style.opacity = 0;
      }, 2000);
    }

    function drawAura(x, y, r, color) {
      const gradient = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 2.5);
      gradient.addColorStop(0, color);
      gradient.addColorStop(1, "transparent");
      ctx.beginPath();
      ctx.arc(x, y, r * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    function drawCircle(e) {
      const auraColor = powerActive && e === player ? "rgba(255,255,100,0.3)" : "rgba(255,255,255,0.08)";
      drawAura(e.x, e.y, e.radius, auraColor);
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.fillStyle = e.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = e.color;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawShockwave(x, y, radius) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,255,150,0.2)";
      ctx.lineWidth = 6;
      ctx.stroke();
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function moveToward(entity, target, speed) {
      const dx = target.x - entity.x;
      const dy = target.y - entity.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 0) {
        entity.x += (dx / dist) * speed;
        entity.y += (dy / dist) * speed;
      }
    }

    function spawnFragment() {
      const rand = Math.random();
      let color = "#ff0055", trap = false, rare = false;
      if (rand < 0.05) { color = "#ffff66"; rare = true; }
      else if (rand < 0.35) { color = "#00ffff"; trap = true; }
      fragments.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: 6,
        color,
        trap,
        rare
      });
    }

    function spawnBot() {
      const isHunter = Math.random() < 0.5;
      bots.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: 20 + Math.random() * 10,
        color: isHunter ? "#9933ff" : "#00ccff",
        speed: 2.2,
        type: isHunter ? "hunter" : "wanderer"
      });
    }
        function repelBots() {
      bots.forEach(bot => {
        const d = distance(player, bot);
        if (d < 200) {
          const dx = bot.x - player.x;
          const dy = bot.y - player.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 0) {
            bot.x += (dx / dist) * 12;
            bot.y += (dy / dist) * 12;
          }
        }
      });
    }

    function updateGame() {
      moveToward(player, mouse, player.speed);

      bots.forEach(bot => {
        if (bot.type === "hunter") {
          moveToward(bot, player, bot.speed);
        } else {
          // bots errants visent les fragments
          let closest = null;
          let minDist = Infinity;
          fragments.forEach(f => {
            const d = distance(bot, f);
            if (d < minDist) {
              minDist = d;
              closest = f;
            }
          });
          if (closest) moveToward(bot, closest, bot.speed);
        }
      });

      // joueur mange fragments
      fragments = fragments.filter(f => {
        if (distance(f, player) < player.radius + f.radius) {
          if (f.rare) {
            powerActive = true;
            powerTimer = 240; // 4 secondes
            showPhrase("Un pouvoir ancien s’éveille...");
          } else if (f.trap) {
            player.radius = Math.max(10, player.radius / 2);
            if (Math.random() < 0.5) showPhrase("Un fragment piégé...");
          } else {
            player.radius += 1;
            if (Math.random() < 0.4) showPhrase(phrases[Math.floor(Math.random() * phrases.length)]);
          }
          spawnFragment();
          return false;
        }
        return true;
      });

      // bots mangent fragments
      for (let bot of bots) {
        fragments = fragments.filter(f => {
          if (distance(f, bot) < bot.radius + f.radius) {
            if (f.trap) {
              bot.radius = Math.max(10, bot.radius / 2);
            } else {
              bot.radius += 0.4;
            }
            spawnFragment();
            return false;
          }
          return true;
        });
      }

      while (fragments.length < 10) spawnFragment();

      // collision joueur vs bots
      bots = bots.filter(bot => {
        const isTouching = distance(player, bot) < player.radius + bot.radius;
        if (isTouching) {
          if (player.radius > bot.radius) {
            player.radius += bot.radius / 2;
            absorbedBots++;
            progressBar.style.width = (absorbedBots / targetAbsorbed * 100) + "%";
            showPhrase("L’un des leurs a chuté...");
            return false;
          } else {
            alert("Tu as été absorbé...");
            resetGame();
            return false;
          }
        }
        return true;
      });

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fragments.forEach(drawCircle);
      bots.forEach(drawCircle);
      drawCircle(player);

      if (powerActive) {
        drawShockwave(player.x, player.y, player.radius + (Math.random() * 20 + 40));
        repelBots();
        powerTimer--;
        if (powerTimer <= 0) powerActive = false;
      }

      frame++;
      if (frame % 600 === 0) spawnBot();
      requestAnimationFrame(updateGame);
    }

    function resetGame() {
      player.radius = 15;
      fragments = [];
      bots = [];
      frame = 0;
      absorbedBots = 0;
      powerActive = false;
      powerTimer = 0;
      progressBar.style.width = "0%";
      for (let i = 0; i < 10; i++) spawnFragment();
      for (let i = 0; i < 4; i++) spawnBot();
      updateGame();
    }

    canvas.addEventListener("mousemove", e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    canvas.addEventListener("touchmove", e => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    }, { passive: false });

    resetGame();
  </script>
</body>
</html>
