<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>L’Ombre du Rêveur – .io</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0d0b1f;
      overflow: hidden;
      font-family: 'EB Garamond', serif;
      color: white;
    }
    canvas {
      display: block;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.4);
      padding: 0.5em 1em;
      border-radius: 10px;
      font-size: 1em;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="ui">Fragments : 0 | Bots : 0</div>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };

    class Entity {
      constructor(x, y, radius, color, isBot = false) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;
        this.score = 0;
        this.isBot = isBot;
        this.target = null;
      }

      update() {
        if (!this.isBot) {
          this.x += (mouse.x - this.x) * 0.07;
          this.y += (mouse.y - this.y) * 0.07;
        } else {
          if (!this.target || this.target.collected) {
            this.target = fragments[Math.floor(Math.random() * fragments.length)];
          }
          if (this.target) {
            let dx = this.target.x - this.x;
            let dy = this.target.y - this.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 1) {
              this.x += (dx / dist) * 1.2;
              this.y += (dy / dist) * 1.2;
            }
          }
        }
      }

      draw() {
        ctx.beginPath();
        let gradient = ctx.createRadialGradient(this.x, this.y, 5, this.x, this.y, this.radius);
        gradient.addColorStop(0, "#ffffff");
        gradient.addColorStop(1, this.color);
        ctx.fillStyle = gradient;
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    class Fragment {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = 8 + Math.random() * 3;
        this.collected = false;
      }

      draw() {
        if (!this.collected) {
          ctx.beginPath();
          ctx.fillStyle = "#d9b3ff";
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    const player = new Entity(canvas.width / 2, canvas.height / 2, 15, "#a366ff", false);
    const bots = [
      new Entity(100, 100, 15, "#7754cc", true),
      new Entity(canvas.width - 100, canvas.height - 100, 15, "#7754cc", true)
    ];
    const fragments = Array.from({ length: 25 }, () => new Fragment());

    function updateUI() {
      document.getElementById("ui").innerText =
        "Fragments : " + player.score + " | Bots : " + bots.reduce((sum, b) => sum + b.score, 0);
    }

    function gameLoop() {
      ctx.fillStyle = "rgba(13,11,31,0.25)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      [...bots, player].forEach(e => {
        e.update();
        e.draw();
        fragments.forEach(f => {
          if (!f.collected) {
            const dx = e.x - f.x;
            const dy = e.y - f.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < e.radius + f.radius) {
              f.collected = true;
              e.score++;
              e.radius += 0.6;
            }
          }
        });
      });

      fragments.forEach(f => f.draw());
      updateUI();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();

    canvas.addEventListener("mousemove", e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    canvas.addEventListener("touchmove", e => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    }, { passive: false });

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
