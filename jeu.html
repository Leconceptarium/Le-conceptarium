<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Le Sanctuaire du Rêveur</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'EB Garamond', serif;
      background: #0d0b1f;
    }
    canvas { display: block; }
    #intro {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      padding: 2em;
      color: white;
      border-radius: 12px;
      text-align: center;
      z-index: 10;
    }
    #joystick {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      touch-action: none;
      z-index: 10;
    }
    #stick {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      position: absolute;
      top: 30px;
      left: 30px;
    }
  </style>
</head>
<body>
  <div id="intro">
    *Bienvenue dans le Sanctuaire du Rêveur...*<br><br>
    Trouvez les **3 fragments d’éveil** en évitant les entités hostiles.<br><br>
    <button onclick="startGame()">Commencer</button>
  </div>
  <div id="joystick"><div id="stick"></div></div>
  <canvas id="gameCanvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    let scene, camera, renderer, player, light;
    let fragments = [], collected = 0;
    let enemies = [], enemyTimer = 0;
    let moveX = 0, moveZ = 0;
    let maxBoundary = 40;

    const canvas = document.getElementById("gameCanvas");
    const intro = document.getElementById("intro");

    function startGame() {
      intro.style.display = "none";
      init();
      animate();
    }

    function createMysticPlayer() {
      const group = new THREE.Group();
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(0.6, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0xa366ff, emissive: 0x551177 })
      );
      group.add(core);

      for (let i = 0; i < 2; i++) {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(1.2, 0.05, 16, 100),
          new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x7722aa })
        );
        ring.rotation.x = i === 0 ? Math.PI / 2 : 0;
        group.add(ring);
      }
      return group;
    }

    function init() {
      scene = new THREE.Scene();

      const ambient = new THREE.AmbientLight(0x8888ff, 0.4);
      scene.add(ambient);

      light = new THREE.PointLight(0xffaaff, 1.2, 30);
      light.position.set(0, 6, 6);
      scene.add(light);

      const bgParticles = new THREE.Points(
        new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(
          Array.from({length: 300}, () => (Math.random() - 0.5) * 100), 3)),
        new THREE.PointsMaterial({ color: 0xcc99ff, size: 0.3 })
      );
      scene.add(bgParticles);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const floorGeometry = new THREE.PlaneGeometry(100, 100, 10, 10);
      const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x221133 });
      const floor = new THREE.Mesh(floorGeometry, floorMaterial);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      player = createMysticPlayer();
      player.position.set(0, 0.6, 0);
      scene.add(player);

      camera.position.set(0, 5, 5);
      camera.lookAt(player.position);

      for (let i = 0; i < 3; i++) {
        const frag = new THREE.Mesh(
          new THREE.SphereGeometry(0.4, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0xffe6ff, emissive: 0xaa55ff, emissiveIntensity: 1 })
        );
        frag.position.set((Math.random() - 0.5) * 20, 0.4, (Math.random() - 0.5) * 20);
        fragments.push(frag);
        scene.add(frag);
      }
    }

    function spawnEnemy() {
      const geometry = new THREE.SphereGeometry(0.5, 16, 16);
      const material = new THREE.MeshStandardMaterial({ color: 0xff4444, emissive: 0x550000 });
      const enemy = new THREE.Mesh(geometry, material);
      enemy.position.set((Math.random() - 0.5) * 40, 0.5, (Math.random() - 0.5) * 40);
      scene.add(enemy);
      enemies.push(enemy);
    }

    function animate() {
      requestAnimationFrame(animate);
      light.position.x = Math.sin(Date.now() * 0.001) * 10;
      light.position.z = Math.cos(Date.now() * 0.001) * 10;

      player.position.x += moveX * 0.15;
      player.position.z += moveZ * 0.15;

      // Limite de l’espace
      player.position.x = Math.max(-maxBoundary, Math.min(maxBoundary, player.position.x));
      player.position.z = Math.max(-maxBoundary, Math.min(maxBoundary, player.position.z));

      // Rotation des anneaux
      player.children.forEach(child => {
        if (child.geometry.type === 'TorusGeometry') {
          child.rotation.z += 0.01;
        }
      });

      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 5;
      camera.lookAt(player.position);

      // Collision fragments
      fragments.forEach(frag => {
        if (frag.visible && player.position.distanceTo(frag.position) < 1) {
          frag.visible = false;
          collected++;
          if (collected === 3) showEnd();
        }
      });

      // Ennemis
      enemyTimer++;
      if (enemyTimer % 120 === 0) spawnEnemy();

      enemies.forEach(enemy => {
        const dir = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();
        enemy.position.addScaledVector(dir, 0.03);
        if (enemy.position.distanceTo(player.position) < 0.8) {
          alert("Le Rêveur a été rattrapé par une entité du Néant...");
          location.reload();
        }
      });

      renderer.render(scene, camera);
    }

    function showEnd() {
      const msg = document.createElement("div");
      msg.innerHTML = "<h1 style='color:white;text-align:center;'>Les fragments sont réunis.<br>Le Rêveur s’éveille...</h1>";
      msg.style.position = "absolute";
      msg.style.top = "50%";
      msg.style.left = "50%";
      msg.style.transform = "translate(-50%, -50%)";
      msg.style.zIndex = "15";
      document.body.appendChild(msg);
    }

    // Joystick mobile
    const joystick = document.getElementById("joystick");
    const stick = document.getElementById("stick");
    let dragging = false;

    joystick.addEventListener("touchstart", () => { dragging = true; });
    joystick.addEventListener("touchmove", e => {
      if (!dragging) return;
      const touch = e.touches[0];
      const rect = joystick.getBoundingClientRect();
      const dx = touch.clientX - rect.left - 50;
      const dy = touch.clientY - rect.top - 50;
      stick.style.left = `${dx + 30}px`;
      stick.style.top = `${dy + 30}px`;
      moveX = dx / 50;
      moveZ = dy / 50;
    });
    joystick.addEventListener("touchend", () => {
      dragging = false;
      moveX = 0; moveZ = 0;
      stick.style.left = "30px";
      stick.style.top = "30px";
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
