<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Le Sanctuaire du Rêveur</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background-color: #0d0b1f;
      overflow: hidden;
      font-family: 'EB Garamond', serif;
      color: white;
    }
    canvas { display: block; }
    #intro {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      padding: 2em;
      border-radius: 15px;
      text-align: center;
      z-index: 10;
    }
    #intro button {
      margin-top: 1em;
      padding: 0.6em 1.2em;
      border: none;
      background: #a366ff;
      color: white;
      font-size: 1em;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="intro">
    <p>*Vous êtes dans le sanctuaire du Rêveur...<br>Trouvez les 3 fragments d’éveil.*</p>
    <button onclick="startGame()">Commencer</button>
  </div>
  <canvas id="game"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
  <script>
    let camera, scene, renderer, player;
    let fragments = [];
    const fragmentCount = 3;

    function startGame() {
      document.getElementById("intro").style.display = "none";

      const canvas = document.getElementById("game");
      renderer = new THREE.WebGLRenderer({ canvas });
      renderer.setSize(window.innerWidth, window.innerHeight);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d0b1f);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 5);

      const light = new THREE.PointLight(0xffffff, 1);
      light.position.set(10, 10, 10);
      scene.add(light);

      const ambient = new THREE.AmbientLight(0x8888ff, 0.5);
      scene.add(ambient);

      const floorGeo = new THREE.PlaneGeometry(50, 50);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x111133 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
      const cubeMat = new THREE.MeshStandardMaterial({ color: 0x222255 });

      for (let i = 0; i < 100; i++) {
        const cube = new THREE.Mesh(cubeGeo, cubeMat);
        cube.position.set(
          Math.random() * 40 - 20,
          0.5,
          Math.random() * 40 - 20
        );
        scene.add(cube);
      }

      // Fragments d’éveil
      const fragGeo = new THREE.SphereGeometry(0.3, 16, 16);
      const fragMat = new THREE.MeshStandardMaterial({ color: 0xcc99ff, emissive: 0x9966ff });
      for (let i = 0; i < fragmentCount; i++) {
        const frag = new THREE.Mesh(fragGeo, fragMat);
        frag.position.set(
          Math.random() * 30 - 15,
          0.5,
          Math.random() * 30 - 15
        );
        scene.add(frag);
        fragments.push(frag);
      }

      player = new THREE.Object3D();
      player.position.set(0, 0.5, 0);
      scene.add(player);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      camera.position.lerp(new THREE.Vector3(player.position.x, 2, player.position.z + 5), 0.1);
      camera.lookAt(player.position.x, 1, player.position.z);

      // Collision fragments
      fragments = fragments.filter(frag => {
        const dist = frag.position.distanceTo(player.position);
        if (dist < 1) {
          scene.remove(frag);
          if (fragments.length === 1) {
            alert("Vous avez trouvé les 3 fragments. Le Rêveur s’éveille...");
            location.reload();
          }
          return false;
        }
        return true;
      });

      renderer.render(scene, camera);
    }

    // Contrôle mobile tactile
    let isTouching = false;
    let touchStartX = 0, touchStartY = 0;

    document.addEventListener("touchstart", e => {
      isTouching = true;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    document.addEventListener("touchmove", e => {
      if (isTouching && e.touches.length > 0) {
        let dx = e.touches[0].clientX - touchStartX;
        let dy = e.touches[0].clientY - touchStartY;

        player.position.x += dx * 0.005;
        player.position.z += dy * 0.005;

        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    });

    document.addEventListener("touchend", () => {
      isTouching = false;
    });

    window.addEventListener("resize", () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
