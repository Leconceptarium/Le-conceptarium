<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Le Sanctuaire du Rêveur</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0d0b1f;
      font-family: 'EB Garamond', serif;
    }
    #overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      color: white;
      font-size: 1.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10;
      text-align: center;
      padding: 2em;
    }
    #startBtn {
      margin-top: 1em;
      padding: 0.5em 1.5em;
      background-color: #a366ff;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      color: white;
      cursor: pointer;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <p>*Vous êtes dans le sanctuaire du Rêveur...<br>Trouvez les 3 fragments d’éveil.*</p>
    <button id="startBtn">Commencer</button>
  </div>
  <canvas id="gameCanvas"></canvas>

  <!-- Import Three.js en script classique -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const renderer = new THREE.WebGLRenderer({ canvas });
    renderer.setSize(window.innerWidth, window.innerHeight);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#0d0b1f");

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 5);

    const light = new THREE.PointLight(0xffffff, 1, 100);
    light.position.set(10, 10, 10);
    scene.add(light);

    const geometry = new THREE.BoxGeometry();
    const material = new THREE.MeshStandardMaterial({ color: "#a366ff" });
    const player = new THREE.Mesh(geometry, material);
    scene.add(player);

    const fragments = [];
    for (let i = 0; i < 3; i++) {
      const frag = new THREE.Mesh(
        new THREE.SphereGeometry(0.3, 32, 32),
        new THREE.MeshStandardMaterial({ color: "#9933ff", emissive: "#ff99ff" })
      );
      frag.position.set(Math.random() * 10 - 5, 0.5, Math.random() * 10 - 5);
      scene.add(frag);
      fragments.push(frag);
    }

    let keys = {};
    window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

    function movePlayer() {
      if (keys["z"] || keys["arrowup"]) player.position.z -= 0.1;
      if (keys["s"] || keys["arrowdown"]) player.position.z += 0.1;
      if (keys["q"] || keys["arrowleft"]) player.position.x -= 0.1;
      if (keys["d"] || keys["arrowright"]) player.position.x += 0.1;
    }

    let collected = 0;

    function animate() {
      requestAnimationFrame(animate);
      movePlayer();

      fragments.forEach((frag) => {
        if (!frag.visible) return;
        const dist = frag.position.distanceTo(player.position);
        if (dist < 1) {
          frag.visible = false;
          collected++;
          if (collected === 3) {
            alert("Vous avez trouvé les 3 fragments d’éveil.");
            location.reload();
          }
        }
      });

      renderer.render(scene, camera);
    }

    document.getElementById("startBtn").onclick = () => {
      document.getElementById("overlay").style.display = "none";
      animate();
    };

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
