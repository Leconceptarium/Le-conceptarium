<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Le Sanctuaire du Rêveur</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&display=swap');
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #15002b 0%, #000010 100%);
      font-family: 'Unbounded', sans-serif;
    }
    canvas {
      display: block;
    }
    h1 {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 28px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 10px #ff00cc;
    }
    #phrase {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 18px;
      text-shadow: 0 0 10px #ff00cc;
      z-index: 15;
      opacity: 0;
      transition: opacity 1s;
    }
    #powerButton {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      font-size: 16px;
      background: #ffff66;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      z-index: 20;
      display: none;
      box-shadow: 0 0 15px #ffff66;
    }
  </style>
</head>
<body>
  <h1>Le Sanctuaire du Rêveur</h1>
  <div id="phrase"></div>
  <button id="powerButton">Pouvoir du Rêveur</button>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const phraseEl = document.getElementById("phrase");
    const powerButton = document.getElementById("powerButton");

    let player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 15,
      color: "#ffffff"
    };

    let mouse = { x: player.x, y: player.y };
    let fragments = [];
    let bots = [];
    let frame = 0;
    let powerActive = false;
    let powerTimeout = null;

    function showPhrase(text) {
      phraseEl.textContent = text;
      phraseEl.style.opacity = 1;
      setTimeout(() => {
        phraseEl.style.opacity = 0;
      }, 2000);
    }

    function drawAura(x, y, r, color) {
      const gradient = ctx.createRadialGradient(x, y, r, x, y, r * 2.5);
      gradient.addColorStop(0, color);
      gradient.addColorStop(1, "transparent");
      ctx.beginPath();
      ctx.arc(x, y, r * 2.5, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    function drawCircle(e) {
      const auraColor = powerActive && e === player ? "rgba(255,255,100,0.4)" : "rgba(255,255,255,0.1)";
      drawAura(e.x, e.y, e.radius, auraColor);
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.fillStyle = e.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = e.color;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function spawnFragment() {
      const rand = Math.random();
      let color = "#ff0055", trap = false, rare = false;
      if (rand < 0.05) { color = "#ffff66"; rare = true; }
      else if (rand < 0.35) { color = "#00ffff"; trap = true; }
      fragments.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: 6,
        color,
        trap,
        rare
      });
    }

    function spawnBot() {
      const isHunter = Math.random() < 0.5;
      bots.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: 20 + Math.random() * 10,
        color: isHunter ? "#9933ff" : "#00ccff",
        speed: isHunter ? 1.4 : 0.6,
        type: isHunter ? "hunter" : "wanderer",
        angle: Math.random() * 2 * Math.PI
      });
    }
        function repelBots() {
      bots.forEach(bot => {
        if (distance(player, bot) < 250) {
          const dx = bot.x - player.x;
          const dy = bot.y - player.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 0) {
            bot.x += (dx / dist) * 60;
            bot.y += (dy / dist) * 60;
          }
        }
      });
    }

    function activatePower() {
      if (!powerActive) return;
      repelBots();
    }

    function startPower() {
      powerActive = true;
      powerButton.style.display = "block";
      showPhrase("Un pouvoir ancien s'éveille...");
      if (powerTimeout) clearTimeout(powerTimeout);
      powerTimeout = setTimeout(() => {
        powerActive = false;
        powerButton.style.display = "none";
      }, 2000);
    }

    function moveWanderer(bot) {
      bot.x += Math.cos(bot.angle) * bot.speed;
      bot.y += Math.sin(bot.angle) * bot.speed;
      if (Math.random() < 0.01) bot.angle += (Math.random() - 0.5);
    }

    function updateGame() {
      player.x += (mouse.x - player.x) * 0.08;
      player.y += (mouse.y - player.y) * 0.08;

      bots.forEach(bot => {
        if (bot.type === "hunter") {
          const dx = player.x - bot.x;
          const dy = player.y - bot.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 0) {
            bot.x += (dx / dist) * bot.speed;
            bot.y += (dy / dist) * bot.speed;
          }
        } else {
          moveWanderer(bot);
        }
      });

      fragments = fragments.filter(f => {
        if (distance(f, player) < player.radius + f.radius) {
          if (f.rare) startPower();
          else if (f.trap) {
            player.radius = Math.max(10, player.radius / 2);
            if (Math.random() < 0.5) showPhrase("Un fragment piégé...");
          } else {
            player.radius += 1;
            if (Math.random() < 0.4) showPhrase("Un souvenir oublié...");
          }
          spawnFragment(); // remplacer immédiatement
          return false;
        }
        return true;
      });

      for (let bot of bots) {
        if (bot.type === "wanderer") {
          fragments = fragments.filter(f => {
            if (distance(f, bot) < bot.radius + f.radius) {
              bot.radius += 0.5;
              spawnFragment();
              return false;
            }
            return true;
          });
        }
      }

      bots = bots.filter(bot => {
        if (bot.type === "hunter" && distance(player, bot) < player.radius + bot.radius) {
          if (player.radius > bot.radius) {
            player.radius += bot.radius / 2;
            return false;
          } else {
            alert("Tu as été absorbé...");
            resetGame();
            return false;
          }
        }
        return true;
      });

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fragments.forEach(drawCircle);
      bots.forEach(drawCircle);
      drawCircle(player);

      frame++;
      if (frame % 600 === 0) spawnBot();
      requestAnimationFrame(updateGame);
    }

    function resetGame() {
      player.radius = 15;
      fragments = [];
      bots = [];
      frame = 0;
      powerActive = false;
      powerButton.style.display = "none";
      for (let i = 0; i < 10; i++) spawnFragment();
      for (let i = 0; i < 4; i++) spawnBot();
      updateGame();
    }

    canvas.addEventListener("mousemove", e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    canvas.addEventListener("touchmove", e => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    }, { passive: false });

    powerButton.addEventListener("click", activatePower);
    resetGame();
  </script>
</body>
</html>
