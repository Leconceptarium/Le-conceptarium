<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Le Sanctuaire du Rêveur</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #15002b, #000010);
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    h1 {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 28px;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 10px #ff00cc;
    }
    #progress {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      overflow: hidden;
      z-index: 15;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ff00cc, #00ffff);
      transition: width 0.3s ease;
    }
    #phrase {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 18px;
      text-shadow: 0 0 10px #ff00cc;
      z-index: 15;
      opacity: 0;
      transition: opacity 1s;
    }
  </style>
</head>
<body>
  <h1>Le Sanctuaire du Rêveur</h1>
  <div id="progress"><div id="progress-bar"></div></div>
  <div id="phrase"></div>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const phraseEl = document.getElementById("phrase");
    const progressBar = document.getElementById("progress-bar");

    let lastTime = performance.now();
    let frameTimer = 0;

    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 15,
      color: "#ffffff",
      speed: 135 // px/sec
    };

    let mouse = { x: player.x, y: player.y };
    let fragments = [];
    let bots = [];
    let powerActive = false;
    let powerTimer = 0;
    let absorbedBots = 0;
    const targetAbsorbed = 10;

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function drawCircle(e) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.fillStyle = e.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = e.color;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function moveTowardFixed(entity, target, speed, delta) {
      const dx = target.x - entity.x;
      const dy = target.y - entity.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 0) {
        const move = speed * delta;
        entity.x += (dx / dist) * move;
        entity.y += (dy / dist) * move;
      }
    }

    function spawnFragment() {
      const rand = Math.random();
      let color = "#ff0055", trap = false, rare = false;
      if (rand < 0.05) { color = "#ffff66"; rare = true; }
      else if (rand < 0.35) { color = "#00ffff"; trap = true; }
      fragments.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: 6,
        color,
        trap,
        rare
      });
    }

    function spawnBot() {
      const isHunter = Math.random() < 0.5;
      bots.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: 20 + Math.random() * 10,
        color: isHunter ? "#9933ff" : "#00ccff",
        speed: isHunter ? 100 : 130,
        type: isHunter ? "hunter" : "wanderer"
      });
    }

    function repelBots(delta) {
      bots.forEach(bot => {
        const d = distance(player, bot);
        if (d < 200) {
          const dx = bot.x - player.x;
          const dy = bot.y - player.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 0) {
            bot.x += (dx / dist) * 200 * delta;
            bot.y += (dy / dist) * 200 * delta;
          }
        }
      });
    }

    function drawShockwave(x, y, radius) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,255,150,0.2)";
      ctx.lineWidth = 6;
      ctx.stroke();
    }

    function gameLoop(now) {
      const delta = (now - lastTime) / 1000;
      lastTime = now;
      frameTimer += delta;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      moveTowardFixed(player, mouse, player.speed, delta);

      bots.forEach(bot => {
        if (bot.type === "hunter") {
          moveTowardFixed(bot, player, bot.speed, delta);
        } else {
          let closest = null;
          let minDist = Infinity;
          fragments.forEach(frag => {
            const d = distance(bot, frag);
            if (d < minDist) {
              minDist = d;
              closest = frag;
            }
          });
          if (closest) moveTowardFixed(bot, closest, bot.speed, delta);
        }
      });

      fragments = fragments.filter(f => {
        if (distance(player, f) < player.radius + f.radius) {
          if (f.rare) {
            powerActive = true;
            powerTimer = 4;
          } else if (f.trap) {
            player.radius = Math.max(10, player.radius / 2);
          } else {
            player.radius += 1;
          }
          spawnFragment();
          return false;
        }
        return true;
      });

      for (let bot of bots) {
        fragments = fragments.filter(f => {
          if (distance(bot, f) < bot.radius + f.radius) {
            bot.radius += f.trap ? -0.6 : 0.6;
            spawnFragment();
            return false;
          }
          return true;
        });
      }

      while (fragments.length < 10) spawnFragment();

      bots = bots.filter(bot => {
        if (distance(player, bot) < player.radius + bot.radius) {
          if (player.radius > bot.radius) {
            player.radius += bot.radius / 2;
            absorbedBots++;
            progressBar.style.width = (absorbedBots / targetAbsorbed * 100) + "%";
            return false;
          } else {
            alert("Tu as été absorbé...");
            resetGame();
            return false;
          }
        }
        return true;
      });

      fragments.forEach(drawCircle);
      bots.forEach(drawCircle);
      drawCircle(player);

      if (powerActive) {
        drawShockwave(player.x, player.y, player.radius + (Math.random() * 20 + 40));
        repelBots(delta);
        powerTimer -= delta;
        if (powerTimer <= 0) powerActive = false;
      }

      // Nouveau bot toutes les 3 secondes
      if (frameTimer >= 3) {
        spawnBot();
        frameTimer = 0;
      }

      requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      player.radius = 15;
      fragments = [];
      bots = [];
      absorbedBots = 0;
      powerActive = false;
      powerTimer = 0;
      frameTimer = 0;
      progressBar.style.width = "0%";
      for (let i = 0; i < 10; i++) spawnFragment();
      for (let i = 0; i < 4; i++) spawnBot();
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    canvas.addEventListener("mousemove", e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    canvas.addEventListener("touchmove", e => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    }, { passive: false });

    resetGame();
  </script>
</body>
</html>
