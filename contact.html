<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Le Conceptarium</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-contact">

  <header>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="projets.html">Projets</a>
      <a href="prestations.html">Prestations</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="blog.html">Blog</a>
    </nav>
  </header>

  <main class="contact-section">
    <h1 class="pulse">Prenons contact</h1>
    <p class="intro">Une idée, un projet, une envie de franchir les portes de l’imaginaire ? Laisse un message, et faisons naître l’impossible.</p>

    <form onsubmit="sendMail(event)" class="contact-form">
  <label>Nom :
    <input type="text" id="nom" required />
  </label>

  <label>Email :
    <input type="email" id="email" required />
  </label>

  <label>Message :
    <textarea id="message" rows="6" required></textarea>
  </label>

  <button type="submit">Envoyer le message</button>
</form>

<script>
  function sendMail(event) {
    event.preventDefault();
    const nom = document.getElementById("nom").value;
    const email = document.getElementById("email").value;
    const message = document.getElementById("message").value;

    const subject = encodeURIComponent("Message depuis le site Le Conceptarium");
    const body = encodeURIComponent(`Nom : ${nom}\nEmail : ${email}\n\n${message}`);

    window.location.href = `mailto:leconceptarium@gmail.com?subject=${subject}&body=${body}`;
  }
</script>
