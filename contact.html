<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Le Conceptarium</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-contact">

  <header>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="projets.html">Projets</a>
      <a href="prestations.html">Prestations</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="blog.html">Blog</a>
    </nav>
  </header>

  <main class="contact-section">
    <h1 class="pulse">Prenons contact</h1>
    <p class="intro">Une idée, un projet, une envie de franchir les portes de l’imaginaire ? Laisse un message, et faisons naître l’impossible.</p>

    <form action="https://formspree.io/f/yourcode" method="POST" class="contact-form">
      <label>Nom :
        <input type="text" name="name" required />
      </label>

      <label>Email :
        <input type="email" name="email" required />
      </label>

      <label>Message :
        <textarea name="message" rows="6" required></textarea>
      </label>

      <button type="submit">Envoyer le message</button>
    </form>
  </main>

  <footer>
    <p>&copy; Le Conceptarium – Tous droits réservés</p>
  </footer>
</body>
</html>
